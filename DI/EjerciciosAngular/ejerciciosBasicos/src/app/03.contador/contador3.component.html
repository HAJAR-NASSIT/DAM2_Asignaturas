<div style="border: 2px solid #00bcd4; padding: 20px; border-radius: 8px; max-width: 400px; font-family: Arial, sans-serif;">
<h2>🔢 Contador Reactivo Avanzado</h2>

<!-- Recuerda poner paréntesis () para leer el Signal 'numero' -->
<h3>Valor actual: <strong style="color: #00bcd4;">{{ numero() }}</strong></h3>

<div style="margin-bottom: 15px;">
<label style="display: block; margin-bottom: 5px;"><strong>Configura tu base personalizada:</strong></label>
<!-- Conectamos el input con la propiedad 'base' en doble sentido -->
<input 
    type="number" 
    [(ngModel)]="base" 
    style="padding: 6px; width: 80px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px;"
>
</div>

<!-- Los botones se actualizan visualmente al instante según lo que escribas -->
<button (click)="sumar()" style="padding: 8px 12px; cursor: pointer;">➕ Sumar {{ base }}</button>
<button (click)="restar()" style="margin-left: 10px; padding: 8px 12px; cursor: pointer;">➖ Restar {{ base }}</button>
</div>
